plugins {
    id 'com.android.application'
}

android {
    namespace 'it.fantaformation'
    compileSdk 35

    defaultConfig {
        applicationId "it.fantaformation"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
}
